<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖床管理員 2.1</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #f5f3fa; color: #29243a; }
  .header { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; padding: 28px 24px 32px; }
  .header-inner { max-width: 1200px; margin: auto; }
  .header h1 { margin: 0; font-size: 28px; }
  .container { max-width: 1200px; margin: -16px auto 40px; padding: 0 18px; }
  .card { background: white; border-radius: 16px; box-shadow: 0 5px 22px rgba(35,20,60,.08); padding: 20px; margin-bottom: 18px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .section-title h2 { margin: 0; font-size: 18px; }
  .token-row, .folder-row { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select { flex: 1; min-width: 120px; border: 1px solid #ddd6e8; border-radius: 10px; padding: 11px 13px; font-size: 14px; outline: none; }
  input:focus { border-color: #8b5cf6; }
  button { border: 0; border-radius: 10px; padding: 10px 15px; font-size: 14px; cursor: pointer; }
  .primary { background: #7c3aed; color: white; }
  .secondary { background: #f0ebfa; color: #6334b5; }
  .danger { background: #fee2e2; color: #b91c1c; }
  .drop-zone { border: 2px dashed #c4b5fd; background: #faf8ff; border-radius: 14px; padding: 38px 20px; text-align: center; cursor: pointer; }
  .drop-zone.dragover { background: #f3edff; border-color: #7c3aed; }
  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .file-card { background: white; border: 1px solid #ece8f2; border-radius: 14px; overflow: hidden; }
  .preview { height: 180px; background: #f7f5fa; display: flex; align-items: center; justify-content: center; }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  .file-info { padding: 14px; }
  .file-name { font-weight: 600; font-size: 14px; }
  .file-path { font-size: 11px; color: #8a8195; margin: 4px 0 8px; }
  .url-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .url-row input { flex: 1; font-size: 11px; padding: 6px 8px; }
  .copy-btn { background: #ede9fe; color: #6d28d9; padding: 6px 10px; border-radius: 6px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { flex: 1; padding: 6px; font-size: 12px; }
  .toast-container { position: fixed; right: 18px; bottom: 18px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 36px); }
  .toast { background: #29243a; color: white; padding: 12px 16px; border-radius: 11px; font-size: 13px; animation: toastIn .25s ease; }
  .toast.success { background: #15803d; }
  .toast.error { background: #b91c1c; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<header class="header"><div class="header-inner"><h1>📁 圖床管理員 2.1</h1></div></header>
<main class="container">
  <section class="card">
    <div class="section-title"><h2>🔑 Token</h2></div>
    <div class="token-row">
      <input id="tokenInput" type="password" placeholder="輸入 GitHub Token">
      <button class="primary" onclick="saveToken()">儲存</button>
    </div>
  </section>

  <section class="card">
    <div class="section-title"><h2>📂 資料夾管理</h2></div>
    <div class="folder-row">
      <input id="folderInput" placeholder="輸入名稱，例如 avatar">
      <button class="primary" onclick="createFolder()">＋ 新增</button>
      <button class="secondary" onclick="loadFiles()">↻ 重整</button>
    </div>
  </section>

  <section class="card">
    <div class="section-title"><h2>📤 上傳</h2></div>
    <div style="margin-bottom:10px;">
      <select id="uploadFolderSelect"><option value="">（根目錄）</option></select>
    </div>
    <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <strong>點選或拖曳上傳</strong>
    </div>
    <input id="fileInput" type="file" multiple>
    <div id="uploadList"></div>
  </section>

  <section class="card">
    <div class="section-title"><h2>🗂️ 圖庫 <span id="fileCount">0</span></h2></div>
    <div id="library"><div class="empty">載入中...</div></div>
  </section>
</main>
<div id="toastContainer" class="toast-container"></div>

<script>
const USER = "hateubaby666-design";
const REPO = "11";
const BRANCH = "main";
const API = `https://api.github.com/repos/${USER}/${REPO}/contents`;
const CDN = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/`;
const TOKEN_KEY = "github_image_host_token";

let allFiles = [];

function getToken() { return localStorage.getItem(TOKEN_KEY) || document.getElementById("tokenInput").value.trim(); }
function saveToken() {
  const t = document.getElementById("tokenInput").value.trim();
  if (!t) return showToast("請輸入 Token", "error");
  localStorage.setItem(TOKEN_KEY, t);
  showToast("Token 已儲存", "success");
  loadFiles();
}
function showToast(msg, type = "") {
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.remove(); }, 3000);
}

function headers() {
  const t = getToken();
  if (!t) throw new Error("未設定 Token");
  return { "Authorization": `Bearer ${t}`, "Accept": "application/vnd.github+json" };
}

async function ghReq(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { ...headers(), ...(opt.headers || {}) } });
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.message || `HTTP ${r.status}`); }
  return r.json();
}

async function loadFiles() {
  const lib = document.getElementById("library");
  lib.innerHTML = "載入中...";
  try {
    const data = await ghReq(`${API}?ref=${BRANCH}`);
    allFiles = data.filter(f => f.type === "file");
    const folders = [...new Set(allFiles.map(f => f.path.split("/").slice(0, -1).join("/")).filter(Boolean))];
    const selects = document.querySelectorAll("#uploadFolderSelect");
    selects.forEach(sel => {
      sel.innerHTML = `<option value="">（根目錄）</option>` + folders.map(f => `<option value="${f}">${f}</option>`).join("");
    });
    document.getElementById("fileCount").textContent = allFiles.length;
    if (!allFiles.length) { lib.innerHTML = "無檔案"; return; }
    const grid = document.createElement("div");
    grid.className = "file-grid";
    allFiles.forEach(f => grid.appendChild(createCard(f)));
    lib.innerHTML = "";
    lib.appendChild(grid);
  } catch(e) { lib.innerHTML = `錯誤：${e.message}`; }
}

function createCard(file) {
  const card = document.createElement("div");
  card.className = "file-card";
  const url = CDN + file.path;
  const ext = file.name.split(".").pop().toLowerCase();
  const isImg = ["jpg","jpeg","png","gif","webp","svg","bmp","ico"].includes(ext);
  const isAudio = ["mp3","wav","m4a","ogg","flac","aac"].includes(ext);
  const preview = document.createElement("div");
  preview.className = "preview";
  if (isImg) { const img = document.createElement("img"); img.src = url; preview.appendChild(img); }
  else if (isAudio) { const a = document.createElement("audio"); a.controls = true; a.src = url; preview.appendChild(a); }
  else preview.textContent = "📄";
  card.appendChild(preview);
  const info = document.createElement("div");
  info.className = "file-info";
  info.innerHTML = `<div class="file-name">${file.name}</div><div class="file-path">📂 ${file.path}</div>`;
  const row = document.createElement("div");
  row.className = "url-row";
  const inp = document.createElement("input");
  inp.value = url; inp.readOnly = true;
  const copy = document.createElement("button");
  copy.className = "copy-btn";
  copy.textContent = "複製";
  copy.onclick = () => { navigator.clipboard.writeText(url); showToast("已複製", "success"); };
  row.append(inp, copy);
  info.appendChild(row);
  const acts = document.createElement("div");
  acts.className = "actions";
  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "刪除";
  del.onclick = () => deleteFile(file);
  acts.appendChild(del);
  info.appendChild(acts);
  card.appendChild(info);
  return card;
}

async function deleteFile(file) {
  if (!confirm(`刪除 ${file.path}？`)) return;
  try {
    await ghReq(`${API}/${encodeURIComponent(file.path)}`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: `Delete ${file.name}`, sha: file.sha, branch: BRANCH })
    });
    showToast("已刪除", "success");
    loadFiles();
  } catch(e) { showToast(e.message, "error"); }
}

async function createFolder() {
  const name = document.getElementById("folderInput").value.trim();
  if (!name) return showToast("請輸入名稱", "error");
  try {
    // 先取得最新的 commit SHA
    const ref = await ghReq(`https://api.github.com/repos/${USER}/${REPO}/git/refs/heads/${BRANCH}`);
    const latestSha = ref.object.sha;
    // 取得目前根目錄的 tree
    const tree = await ghReq(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${latestSha}?recursive=1`);
    // 檢查是否已有 .keep 檔案
    const keepPath = `${name}/.keep`;
    const existing = tree.tree.find(item => item.path === keepPath);
    if (existing) {
      showToast(`資料夾 ${name} 已存在`, "error");
      return;
    }
    // 建立 .keep 檔案 (使用空內容)
    const content = btoa(""); // 空檔案
    await ghReq(`${API}/${encodeURIComponent(keepPath)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Create folder ${name}`,
        content: content,
        branch: BRANCH
      })
    });
    showToast(`✅ 資料夾 ${name} 已建立`, "success");
    document.getElementById("folderInput").value = "";
    loadFiles();
  } catch(e) {
    showToast(`建立失敗：${e.message}`, "error");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem(TOKEN_KEY)) {
    document.getElementById("tokenInput").value = localStorage.getItem(TOKEN_KEY);
    loadFiles();
  }
  const dz = document.getElementById("dropZone");
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
  dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("dragover"); handleFiles([...e.dataTransfer.files]); });
  document.getElementById("fileInput").addEventListener("change", e => { handleFiles([...e.target.files]); e.target.value = ""; });
});

async function handleFiles(files) {
  if (!files.length) return;
  const folder = document.getElementById("uploadFolderSelect").value;
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(",")[1];
        const path = folder ? `${folder}/${file.name}` : file.name;
        await ghReq(`${API}/${encodeURIComponent(path)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Upload ${file.name}`, content: base64, branch: BRANCH })
        });
        showToast(`${file.name} 上傳成功`, "success");
        loadFiles();
      } catch(e) { showToast(`${file.name} 失敗：${e.message}`, "error"); }
    };
    reader.readAsDataURL(file);
  }
}
</script>
</body>
</html>
